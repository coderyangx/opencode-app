<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/ai-man.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite + React</title>

  <!-- 只在生产环境使用 CDN 加载 React 和相关库 -->
  <script type="module">
    // 生产环境检测
    console.log('生产环境', import.meta)
    if (import.meta.env.PROD) {
      // 使用 UMD 版本的 React（稳定且无 CORS 问题）
      document.write(
        '<script crossorigin src="https://unpkg.com/react@19.1.0/umd/react.production.min.js"><\/script>' +
        '<script crossorigin src="https://unpkg.com/react-dom@19.1.0/umd/react-dom.production.min.js"><\/script>' +
        '<script crossorigin src="https://cdn.jsdelivr.net/npm/react-router-dom@7.13.1/umd/react-router-dom.min.js"><\/script>'
      );
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
