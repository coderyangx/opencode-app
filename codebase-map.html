<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Codebase Explorer</title>
  <style>
    body {
      font: 14px/1.5 system-ui, sans-serif;
      margin: 0;
      background: #1a1a2e;
      color: #eee;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 280px;
      background: #252542;
      padding: 20px;
      border-right: 1px solid #3d3d5c;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }

    h2 {
      margin: 20px 0 10px 0;
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #3d3d5c;
    }

    .stat-value {
      font-weight: bold;
    }

    .bar-row {
      display: flex;
      align-items: center;
      margin: 6px 0;
    }

    .bar-label {
      width: 55px;
      font-size: 12px;
      color: #aaa;
    }

    .bar {
      height: 18px;
      border-radius: 3px;
    }

    .bar-pct {
      margin-left: 8px;
      font-size: 12px;
      color: #666;
    }

    .tree {
      list-style: none;
      padding-left: 20px;
    }

    details {
      cursor: pointer;
    }

    summary {
      padding: 4px 8px;
      border-radius: 4px;
    }

    summary:hover {
      background: #2d2d44;
    }

    .folder {
      color: #ffd700;
    }

    .file {
      display: flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .file:hover {
      background: #2d2d44;
    }

    .size {
      color: #888;
      margin-left: auto;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="sidebar">
      <h1>📊 Summary</h1>
      <div class="stat"><span>Files</span><span class="stat-value">18</span></div>
      <div class="stat"><span>Directories</span><span class="stat-value">5</span></div>
      <div class="stat"><span>Total size</span><span class="stat-value">210.6 KB</span></div>
      <div class="stat"><span>File types</span><span class="stat-value">9</span></div>
      <h2>By file type</h2>
      <div class="bar-row"><span class="bar-label">.json</span>
        <div class="bar" style="width:75.81231622591807%;background:#6b7280"></div><span class="bar-pct">75.8%</span>
      </div>
      <div class="bar-row"><span class="bar-label">.jpeg</span>
        <div class="bar" style="width:14.383771299242179%;background:#6b7280"></div><span class="bar-pct">14.4%</span>
      </div>
      <div class="bar-row"><span class="bar-label">.svg</span>
        <div class="bar" style="width:2.6078527766698514%;background:#6b7280"></div><span class="bar-pct">2.6%</span>
      </div>
      <div class="bar-row"><span class="bar-label">.js</span>
        <div class="bar" style="width:1.9710784813883813%;background:#f7df1e"></div><span class="bar-pct">2.0%</span>
      </div>
      <div class="bar-row"><span class="bar-label">.md</span>
        <div class="bar" style="width:1.9427877078908067%;background:#083fa1"></div><span class="bar-pct">1.9%</span>
      </div>
      <div class="bar-row"><span class="bar-label">.jsx</span>
        <div class="bar" style="width:1.622777319147752%;background:#61dafb"></div><span class="bar-pct">1.6%</span>
      </div>
      <div class="bar-row"><span class="bar-label">.css</span>
        <div class="bar" style="width:1.120036360600692%;background:#264de4"></div><span class="bar-pct">1.1%</span>
      </div>
      <div class="bar-row"><span class="bar-label">.html</span>
        <div class="bar" style="width:0.46749343746811495%;background:#e34c26"></div><span class="bar-pct">0.5%</span>
      </div>
    </div>
    <div class="main">
      <h1>📁 my-react-app</h1>
      <ul class="tree" id="root"></ul>
    </div>
  </div>
  <script>
    const data = { "name": "my-react-app", "children": [{ "name": "AGENTS.md", "size": 3333, "ext": ".md" }, { "name": "README.md", "size": 856, "ext": ".md" }, { "name": "eslint.config.js", "size": 763, "ext": ".js" }, { "name": "index.html", "size": 1008, "ext": ".html" }, { "name": "package-lock.json", "size": 162822, "ext": ".json" }, { "name": "package.json", "size": 643, "ext": ".json" }, { "name": "public", "children": [{ "name": "ai-man.png", "size": 31014, "ext": ".jpeg" }, { "name": "vite.svg", "size": 1497, "ext": ".svg" }], "size": 32511 }, { "name": "src", "children": [{ "name": "App.css", "size": 1261, "ext": ".css" }, { "name": "App.jsx", "size": 843, "ext": ".jsx" }, { "name": "assets", "children": [{ "name": "react.svg", "size": 4126, "ext": ".svg" }], "size": 4126 }, { "name": "components", "children": [{ "name": "Modal.jsx", "size": 677, "ext": ".jsx" }], "size": 677 }, { "name": "index.css", "size": 1154, "ext": ".css" }, { "name": "main.jsx", "size": 229, "ext": ".jsx" }, { "name": "pages", "children": [{ "name": "About.jsx", "size": 735, "ext": ".jsx" }, { "name": "Home.jsx", "size": 1015, "ext": ".jsx" }], "size": 1750 }, { "name": "vite-env.d.ts", "size": 155, "ext": ".ts" }], "size": 10195 }, { "name": "vite.config.js", "size": 3487, "ext": ".js" }], "size": 215618 };
    const colors = { ".js": "#f7df1e", ".ts": "#3178c6", ".py": "#3776ab", ".go": "#00add8", ".rs": "#dea584", ".rb": "#cc342d", ".css": "#264de4", ".html": "#e34c26", ".json": "#6b7280", ".md": "#083fa1", ".yaml": "#cb171e", ".yml": "#cb171e", ".mdx": "#083fa1", ".tsx": "#3178c6", ".jsx": "#61dafb", ".sh": "#4eaa25" };
    function fmt(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(1) + ' KB'; return (b / 1048576).toFixed(1) + ' MB'; }
    function render(node, parent) {
      if (node.children) {
        const det = document.createElement('details');
        det.open = parent === document.getElementById('root');
        det.innerHTML = `<summary><span class="folder">📁 ${node.name}</span><span class="size">${fmt(node.size)}</span></summary>`;
        const ul = document.createElement('ul'); ul.className = 'tree';
        node.children.sort((a, b) => (b.children ? 1 : 0) - (a.children ? 1 : 0) || a.name.localeCompare(b.name));
        node.children.forEach(c => render(c, ul));
        det.appendChild(ul);
        const li = document.createElement('li'); li.appendChild(det); parent.appendChild(li);
      } else {
        const li = document.createElement('li'); li.className = 'file';
        li.innerHTML = `<span class="dot" style="background:${colors[node.ext] || '#6b7280'}"></span>${node.name}<span class="size">${fmt(node.size)}</span>`;
        parent.appendChild(li);
      }
    }
    data.children.forEach(c => render(c, document.getElementById('root')));
  </script>
</body>

</html>
